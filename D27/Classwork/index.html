<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classwork</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <form action="">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" minlength="3" maxlength="20" placeholder="Adınızı daxil edin" required>

        <label for="surname">Surname:</label>
        <input type="text" id="surname" name="surname" placeholder="Soyadınızı daxil edin">

        <label for="age">Age:</label>
        <input type="number" id="age" name="age" min="18" max="50" placeholder="Yaşınız">

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" placeholder="Şifrənizi daxil edin">

        <label for="email">Email:</label>
        <input type="email" id="email" name="email">

        <button type="submit">Yadda saxla</button>
        <button type="reset">Sıfırla</button>
    </form> 
</body>
</html>
