<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
    <title>Homework</title>

</head>
<body>

    <div class="container d-flex justify-content-center align-items-center vh-100">
    <div class="card shadow-lg p-4 form-box" id="qeydiyyatKartı">
        <h2 class="text-center text-success mb-4">Qeydiyyat kartı</h2>

        <form id="qeydiyyatFormu">
            
            <!-- Ad -->
            <div class="mb-3">
                <label class="form-label text-muted">Adınız: </label>
                <input type="text" id="adGiriş" class="form-control" placeholder="Adınızı daxil edin" required>
            </div>

            <!-- Soyad -->
            <div class="mb-3">
                <label class="form-label text-muted">Emailiniz: </label>
                <input type="email" id="emailGiriş" class="form-control" placeholder="Emailinizi daxil edin" required>
            </div>

            <!-- Şifrə -->
            <div class="mb-3">
                <label class="form-label text-muted">Şifrəniz: </label>
                <input type="password" id="şifrəGiriş" class="form-control" placeholder="Şifrənizi daxil edin" required>
            </div>

            <!-- Şifrə təkrar -->
             <div class="mb-3">
                <label class="form-label text-muted">Şifrəni təkrarla: </label>
                <input type="password" id="şifrəTəkrar" class="form-control" placeholder="Şifrəni təkrarla" required>
            </div>

            <!-- Yaş -->
            <div class="mb-3">
                <label class="form-label text-muted">Yaşınız: </label>
                <input type="number" id="yaşGiriş" class="form-control" placeholder="Yaşınızı daxil edin" min="18" required>
            </div>

            <button type="submit" class="btn btn-success w-100 font-weight-bold">Qeydiyyatdan keç</button>
        </form>

        <p class="text-center mt-3">Artıq hesabın var? Elə isə,<button id="girişəKeçBtn" class="btn btn-link">daxil ol</button></p>
    </div>

    <div class="card shadow-lg p-4 form-box d-none" id="girişKartı">
        <h2 class="text-center text-success mb-4">Giriş ekranı</h2>
        
        <form id="girişFormu">
            <!-- Email -->
            <div class="mb-3">
                <label class="form-label text-muted">Emailiniz:</label>
                <input type="email" id="loginEmail" class="form-control" placeholder="Emailinizi daxil edin" required>
            </div>

            <!-- Şifrə -->
            <div class="mb-3">
                <label class="form-label text-muted">Şifrəniz:</label>
                <input type="password" id="loginŞifrə" class="form-control" placeholder="Şifrənizi daxil edin" required>
            </div>

            <!-- Şifrəni göstər -->
            <div class="mb-3 form-check">
                <input type="checkbox" class="form-check-input" id="şifrəniGöstər">
                <label class="form-check-label text-muted" for="şifrəniGöstər">Şifrəni göstər</label>
            </div>  

            <button type="submit" class="btn btn-success w-100 font-weight-bold">Daxil ol</button>
        </form>

        <p class="text-center mt-3">Hesabın yoxdur? Elə isə,<button id="qeydiyyataKeçBtn" class="btn btn-link">qeydiyyatdan keç</button></p>
    </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/4.0.0/jquery.min.js" integrity="sha512-8LENNbXmzI/Gbj+OwXmqR6V4QaUAw0/porPzy1+dQoJqC0JPHedWoe0DDOTL2uHA5XXJyIsPtiMHH86pVlay6A==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="./app.js"></script>
</body>
</html>
