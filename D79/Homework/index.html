<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/4.0.0/jquery.min.js" integrity="sha512-8LENNbXmzI/Gbj+OwXmqR6V4QaUAw0/porPzy1+dQoJqC0JPHedWoe0DDOTL2uHA5XXJyIsPtiMHH86pVlay6A==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <title>Homework</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <h1>JQUERY EFFECTS</h1>

    <div class="container">
        <div>
            <div class="boxes" id="box1">
                <p id="toggleText">Toggle</p>
            </div>
            <button id="toggleButton">HIDE</button>
        </div>

        <div>
            <div class="boxes" id="box2">
                <p id="fadeOutText">Fade</p>
            </div>
            <button id="fadeOutButton">FADE OUT</button>
        </div>

        <div>
            <div class="boxes" id="box3">
                <p id="fadeToText">Fade To</p>
            </div>
            <button id="fadeToButton">FADE TO 25%</button>
        </div>

        <div>
            <div class="boxes" id="box4">
                <p id="slideText">Slide</p>
            </div>
            <button id="slideButton">SLIDE DOWN</button>
        </div>
    </div>

    <script src="./app.js"></script>
</body>
</html>
