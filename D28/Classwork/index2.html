<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classwork 2</title>
    <link rel="stylesheet" href="./style2.css">
</head>
<body>
    <div>
        <h2>Check Box Example:</h1>
        <h3>Choose languages</h3>
        <form action="">
            <label for="english">
            <input type="checkbox" id="english" name="language" value="English">English
            </label>

            <label for="spanish">
            <input type="checkbox" id="spanish" name="language" value="Spanish">Hindi
            </label>

            <label for="german">
            <input type="checkbox" id="german" name="language" value="German">German
            </label>

            <label for="french">
            <input type="checkbox" id="french" name="language" value="French">French
            </label>
        </form>
    </div>
</body>
</html>
