<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classwork</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <form action="">
        <p>Select a Technology Brand</p>

        <label for="netflix"></label>
        <input type="radio" id="netflix" name="brand" value="Netflix">Netflix

        <label for="amazon"></label>
        <input type="radio" id="audi" name="brand" value="Audi">Audi

        <label for="microsoft"></label>
        <input type="radio" id="microsoft" name="brand" value="Microsoft">Microsoft

        <button type="submit">Submit</button>

    </form>
</body>
</html>
