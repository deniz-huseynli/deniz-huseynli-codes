<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homework</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div>
    <img src="./parade-logo.png" alt="Parade Logo">
    <h1>Welcome to the Parade Andrea!</h1>
    <p>One more thing: How did you hear about us?</p>
    <form action="">
        <label for="press">
            <input type="radio" name="source" id="press" value="Press">Press / News Article
        </label>

        <label for="facebook">
            <input type="radio" name="source" id="facebook" value="Facebook">Facebook
        </label>

        <label for="tiktok">
            <input type="radio" name="source" id="tiktok" value="Tiktok">TikTok
        </label>

        <label for="twitter">
            <input type="radio" name="source" id="twitter" value="Twitter">Twitter
        </label>

        <label for="other">
            <input type="radio" name="source" id="word" value="Word">Word of Mouth
        </label>

        <label for="podcast">
            <input type="radio" name="source" id="podcast" value="Podcast">Podcast
        </label>

        <label for="youtube">
            <input type="radio" name="source" id="youtube" value="YouTube">YouTube
        </label>

        <label for="newsletter">
            <input type="radio" name="source" id="newsletter" value="Newsletter">Newsletter
        </label>

        <label for="instagram">
            <input type="radio" name="source" id="instagram" value="Instagram">Instagram
        </label>

        <label for="billboard">
            <input type="radio" name="source" id="billboard" value="Billboard">Billboard / Wild Postings
        </label>

        <label for="search">
            <input type="radio" name="source" id="search" value="Search">Search Engine
        </label>

        <label for="event">
            <input type="radio" name="source" id="event" value="Event">Event
        </label>

        <button type="submit">Submit</button>
    </form>
    </div>
</body>
</html>
