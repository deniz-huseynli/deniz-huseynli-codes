<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classwork</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />

<body>
    <div>
        <img src="./image.jpeg" alt="Image">  
    </div>
    <div id="white">
        <h3>Live.<br>Love.<br><div>Decorate.</div></h3>
        <p>Evinizi daha rahat və gözəl etmək üçün ilhamverici dekorasiya həlləri.</p>
        <div>
        <p class="word"><div id="blue"><i class="fas fa-couch"></i></div> <b>Modern Design</b><br> </p>
        <p class="info">Zövqlü və müasir interyer üslubları.</p>
        <p class="word"><div id="green"><i class="fas fa-leaf"></i></div> <b>Natural Materials</b> <br> </p>
        <p class="info">Təbii və keyfiyyətli materiallardan istifadə.</p>
        <p class="word"><div id="orange"><i class="fas fa-heart"></i></div> <b>Cozy Atmosphere</b><br></p>
        <p class="info">Rahat və isti bir ev mühiti yaradın.</p>
        </div>
    </div>
