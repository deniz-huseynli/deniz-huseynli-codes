<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homework</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>

    <div id="main-container">

        <div id="left-side">
            <div>
                <h1>Welcome to Our Platform!</h1>
                <p>Join our community and enjoy exclusive features</p>
            </div>
            <h2>Ready to get <br>started? Join now!</h2>
        </div>

        <div id="right-side">
            <div>
                <i class="fa-solid fa-earth-americas"></i>
                <select>
                    <option value="en">English</option>
                    <option value="az">Azerbaijani</option>
                    <option value="tr">Turkish</option>
                </select>
            </div>
            <h2>Get Started</h2>

            <form action="#">
                <div>
                    <input id="username" type="text" placeholder="Username">
                </div>

                <div>
                    <input id="email" type="email" placeholder="Email">
                </div>

                <div>
                    <input id="password" type="password" placeholder="Password">
                </div>

                <div>
                    <input id="confirm-password" type="password" placeholder="Confirm password">
                </div>

                <div>
                    <input type="checkbox" id="terms">
                    <label id="terms-label" for="terms">I have read and agree to the Terms and Conditions.</label>
                </div>

                <button type="submit" id="sign-up">Sign up</button>
                <div>Or</div>
                <button type="button" id="continue"><i class="fa-brands fa-google"></i> Continue with Google</button>
            </form>
        </div>

    </div>

</body>
</html>
